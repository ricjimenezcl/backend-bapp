services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=mysql+aiomysql://${DB_USER:-service_user}:${DB_PASS:-password}@mysql:3306/${DB_NAME:-service_finder}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app
    command: >
      sh -c "sleep 15 && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-service_finder}
      MYSQL_USER: ${DB_USER:-service_user}
      MYSQL_PASSWORD: ${DB_PASS:-password}
    ports:
      - "3307:3306"  # Cambiado de 3306 a 3307
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/init_database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Cambiado de 6379 a 6380
    restart: unless-stopped

volumes:
  mysql_data: