services:
  - type: web
    name: backend-bapp
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FRONTEND_URL
        value: https://bappsearch.com
      - key: ALLOWED_ORIGINS
        value: '["https://bappsearch.com","https://www.bappsearch.com","https://ricjimenezcl.github.io","http://localhost:8100","http://localhost:4200","http://localhost:4201","http://127.0.0.1:4200","http://127.0.0.1:4201"]'
